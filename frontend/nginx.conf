# P5.D: 前端 nginx 配置
# 同源托管 SPA，并将 API / WebSocket 请求转发到后端（compose 服务名 web:8000）。
# 前端使用相对 BASE，故浏览器访问同源路径，由本配置反向代理。

upstream caipiao_backend {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket 实时推送
    location /ws {
        proxy_pass http://caipiao_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 后端 REST API 前缀
    location ~ ^/(health|auth|profiles|generate|backtest|stats|filters|me|apikeys|openapi|docs) {
        proxy_pass http://caipiao_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退（前端 history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
